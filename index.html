<style>
  :root{
    --bg:#EEF2F8; --card:#FFFFFF; --card-2:#F5F8FC; --border:#D8E0EE;
    --navy:#0B1F4D; --navy-2:#15306B; --gold:#C9A227; --gold-soft:#F4ECCC;
    --text:#152038; --muted:#5B6B8C; --ok:#1E8E5A; --warn:#8A6A12; --warn-bg:#FFF6E0;
    --danger:#C0493F; --r:16px; --tap:56px; --shadow:0 2px 12px rgba(11,31,77,.08);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0A1730; --card:#0F1F3D; --card-2:#132650; --border:#22355f;
    --navy:#EAF0FF; --navy-2:#C7D4F0; --gold:#E3C25A; --gold-soft:#2A2410;
    --text:#EEF2FA; --muted:#9FB0D4; --ok:#4ADE9A; --warn:#E3C25A; --warn-bg:#2A2410;
    --danger:#F0685F; --shadow:0 2px 14px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0A1730; --card:#0F1F3D; --card-2:#132650; --border:#22355f;
    --navy:#EAF0FF; --navy-2:#C7D4F0; --gold:#E3C25A; --gold-soft:#2A2410;
    --text:#EEF2FA; --muted:#9FB0D4; --ok:#4ADE9A; --warn:#E3C25A; --warn-bg:#2A2410; --danger:#F0685F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);font-size:17px;line-height:1.5;}
  .te body,[lang="te"]{font-family:'Noto Sans Telugu','Inter',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .te{font-family:'Noto Sans Telugu','Inter',sans-serif;}

  /* top bar */
  header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;}
  .logo{width:38px;height:38px;border-radius:50%;object-fit:contain;background:#000;flex-shrink:0;}
  .wordmark-wrap{text-align:center;margin:2px 0 16px;}
  .wordmark{width:100%;max-width:300px;height:auto;border-radius:12px;box-shadow:var(--shadow);}
  header .title{font-weight:800;font-size:17px;line-height:1.1;}
  header .title small{display:block;font-weight:500;font-size:11px;color:#AEBEE0;}
  header .spacer{flex:1;}
  .lang-toggle{display:flex;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.22);}
  .lang-toggle button{background:transparent;border:0;color:#cdd8f0;font-weight:700;font-size:13px;padding:7px 11px;min-height:36px;}
  .lang-toggle button.on{background:var(--gold);color:#0B1F4D;}

  main{flex:1;padding:14px;}
  .demo-banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--gold);
    border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:12px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
    box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
  h2{font-size:19px;margin:0 0 4px;color:var(--navy);}
  h3{font-size:15px;margin:0 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;}
  .muted{color:var(--muted);font-size:14px;}
  .pending{color:var(--warn);font-style:italic;font-size:14px;}

  button.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    min-height:var(--tap);border:0;border-radius:14px;background:var(--navy);color:#fff;
    font-size:17px;font-weight:700;cursor:pointer;}
  button.btn.gold{background:var(--gold);color:#0B1F4D;}
  button.btn.ghost{background:var(--card-2);color:var(--navy);border:1px solid var(--border);}
  button.btn:active{transform:translateY(1px);}

  .field{margin-bottom:12px;}
  .field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--navy);}
  .field input{width:100%;min-height:var(--tap);border:1px solid var(--border);border-radius:12px;
    padding:0 14px;font-size:18px;background:var(--card);color:var(--text);}
  .err{color:var(--danger);font-size:14px;margin-top:8px;min-height:18px;}

  /* role picker (demo) */
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .role-grid button{min-height:64px;border-radius:14px;border:1px solid var(--border);
    background:var(--card-2);color:var(--navy);font-weight:700;font-size:15px;padding:8px;cursor:pointer;}
  .role-grid button .r2{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:3px;}

  /* list items */
  .item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);
    border-radius:14px;background:var(--card);margin-bottom:10px;min-height:var(--tap);cursor:pointer;}
  .item .n{width:30px;height:30px;border-radius:8px;background:var(--gold-soft);color:var(--warn);
    display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;font-size:14px;}
  .item .main{flex:1;}
  .item .main .t{font-weight:600;}
  .item .main .s{font-size:13px;color:var(--muted);}
  .item .chev{color:var(--muted);font-size:20px;}
  .timeblock{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;}

  .sop-meta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;}
  .pill{background:var(--card-2);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted);}
  .body-text{white-space:pre-wrap;font-size:17px;line-height:1.7;}
  .te .body-text, .body-text.te{font-family:'Noto Sans Telugu','Inter',sans-serif;}

  .searchbar input{width:100%;min-height:var(--tap);border:1px solid var(--border);border-radius:14px;
    padding:0 14px;font-size:17px;background:var(--card);color:var(--text);margin-bottom:12px;}

  .ackbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(11,31,77,.08);}

  /* helper cards */
  .hcard{border:1px solid var(--border);border-radius:18px;background:var(--card);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .hcard .photo{height:190px;border-radius:14px;overflow:hidden;background:var(--card-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;margin-bottom:12px;}
  .hcard .photo.ph{border-style:dashed;}
  .hcard .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .hcard.playing{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);}
  .hcard.playing .speak{background:var(--gold);color:#0B1F4D;animation:pulse 1s infinite;}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .hcard .hrow{display:flex;align-items:center;gap:12px;}
  .hcard .num{width:44px;height:44px;border-radius:12px;background:var(--gold);color:#0B1F4D;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;}
  .hcard .cap{flex:1;font-size:22px;font-weight:700;}
  .hcard .cap small{display:block;font-size:13px;font-weight:500;color:var(--muted);}
  .hcard .speak{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:0;font-size:22px;flex-shrink:0;}
  .clock{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:6px;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90%;}
  .toast.show{opacity:1;}
  .hidden{display:none !important;}
  .center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;}
  footer{padding:18px 14px calc(18px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:12px;}
</style>
</head>
<body>

function api(action, params){
  if(DEMO) return demoApi(action, params);
  return jsonp(action, params);

function demoApi(action, p){
  return new Promise(function(res){
    setTimeout(function(){
      if(action==='getRole') res({ok:true,data:demoRoleData((p.role_id||'').toUpperCase())});
      else if(action==='getSOP') res({ok:true,data:{code:p.code,title_en:({ "STO-001":"Store Opening Procedure","SAFE-001":"Safety"})[p.code]||p.code,title_te:"",version:"1.1",effective_date:"2026-11-23",body_en:DEMO_SOP_BODY[p.code]||"[SAMPLE]",body_te:""}});
      else if(action==='getTraining') res({ok:true,data:[{month:"2026-12",sop_topics:"[SAMPLE] Opening / Closing / Vehicle",technical_topic:"Wires",questions_en:"",questions_te:""}]});
      else if(action==='acknowledge') res({ok:true,data:{AckID:'DEMO'}});
      else res({ok:true,data:null});
    }, 120);
  });
}
var _seq=0;
function jsonp(action, params){
  return new Promise(function(resolve,reject){
    var cb='__gcb'+(++_seq)+'_'+Date.now();
    var url=new URL(API_URL);
    url.searchParams.set('action',action);
    Object.keys(params||{}).forEach(function(k){ if(params[k]!=null&&params[k]!=='') url.searchParams.set(k,params[k]); });
    url.searchParams.set('callback',cb);
    var s=document.createElement('script'); var done=false;
    var timer=setTimeout(function(){ if(!done){done=true;cleanup();reject(new Error('Network timeout'));} },15000);
    function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(timer); }
    window[cb]=function(data){ if(done)return; done=true; cleanup(); resolve(data); };
    s.onerror=function(){ if(done)return; done=true; cleanup(); reject(new Error('Could not reach the server')); };
    s.src=url.toString(); document.body.appendChild(s);
  });
}

/* Play a task's Telugu voice note. Real audio when audio_url is set; otherwise
   a short simulated "playing" so the button is demonstrable in preview. */
var _audio=null;
function playVoice(url, btn){
  if(_audio){ try{_audio.pause();}catch(e){} _audio=null; }
  var cards=document.querySelectorAll('.hcard.playing');
  for(var i=0;i<cards.length;i++) cards[i].classList.remove('playing');
  var card=btn.parentNode.parentNode; // .hrow -> .hcard
  if(url){
    _audio=new Audio(url);
    card.classList.add('playing');
    _audio.onended=function(){ card.classList.remove('playing'); };
    _audio.play().catch(function(){ card.classList.remove('playing'); toast(t('tel_soon')); });
  } else {
    card.classList.add('playing');
    toast(state.lang==='te' ? 'ఇక్కడ తెలుగు వాయిస్ వినిపిస్తుంది (రికార్డ్ అయ్యాక)' : 'Telugu voice note plays here once recorded');
    setTimeout(function(){ card.classList.remove('playing'); }, 1500);
  }
}

(function boot(){
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ q=null; }
  var emb = q && (q.get('embed')==='1' || q.get('emp'));
  if(emb){
    // Embedded inside PB1 Core: no second login — Core passes the EmpID + token.
    state.embed=true;
    var apiParam=q.get('api'); if(apiParam){ API_URL=apiParam; DEMO=false; }
    var emp=q.get('emp')||'', ctoken=q.get('token')||'';
    applyLang();
    if(DEMO){
      var rid=empToRoleDemo(emp)||'ARJUN';
      state.session=Object.assign({},DEMO_ROLES[rid]); render();
    } else {
      M.innerHTML='<div class="card"><div class="muted">'+t('loading')+'</div></div>';
      api('coreLogin',{emp_id:emp,core_token:ctoken}).then(function(d){
        if(!d.ok){ M.innerHTML='<div class="card"><div class="pending">'+esc(d.error||'Not authorised')+'</div></div>'; return; }
        state.session=d.data; render();
      }).catch(function(e){ M.innerHTML='<div class="card"><div class="pending">'+esc(String(e.message||e))+'</div></div>'; });
    }
    return;
  }
  try{ var saved=sessionStorage.getItem('geeta_session'); if(saved) state.session=JSON.parse(saved);}catch(e){}
  applyLang(); render();
})();

/* service worker (offline shell only; harmless if it fails, e.g. in preview) */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
</script>
</body>
</html>
